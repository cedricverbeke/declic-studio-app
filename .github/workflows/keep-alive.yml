name: Database Keep-Alive

on:
  schedule:
    # S'exécute tous les 3 jours à minuit
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase DB Ping
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            import("@supabase/supabase-js").then(async ({ createClient }) => {
              const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_ANON_KEY);
              
              // On utilise la table "sessions" de votre base
              const { data, error } = await supabase.from("sessions").select("id").limit(1);
              
              if (error) {
                console.error("Erreur lors du réveil de la base de données :", error.message);
                process.exit(1);
              } else {
                console.log("Base de données réveillée avec succès !", data);
              }
            });
          '